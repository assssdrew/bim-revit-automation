# Levels & Grids — допуски и пороги светофора (v1.6.0)
# Единицы: мм для уровней/осей, градусы для угла оси.

# Допуск совпадения (ниже — GREEN по delta)
level_mm=2
grid_mm=5
grid_angle_deg=0.1

# Пороги YELLOW / RED для |delta|
level_delta_yellow_mm=2
level_delta_red_mm=10
grid_delta_yellow_mm=5
grid_delta_red_mm=20
grid_angle_yellow_deg=0.1
grid_angle_red_deg=1.0

# Базовая точка проекта / точка съемки (XY мм, Z мм)
pbp_delta_yellow_mm=5
pbp_delta_red_mm=20
pbp_z_yellow_mm=2
pbp_z_red_mm=10

# Имя/путь эталона (если нет exemplar_model.cfg).
# AUTO или пусто = взять связь из каждой host-модели (БФ→АР, раздел→БФ по корпусу K*)
exemplar_link_default=AUTO

# --- Apply (выборочно: 1=вкл, 0=выкл) ---
# Пары: сначала Monitor (хост мониторит связь), иначе запас по имени
apply_use_monitor=1
apply_name_fallback=1
# Что править у найденных пар:
apply_elevation=1
apply_grid_curve=1
apply_rename=0
# 1 = требовать role=BF в project_map
apply_require_map_bf=0
