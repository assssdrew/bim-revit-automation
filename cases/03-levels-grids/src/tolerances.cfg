# Levels & Grids — допуски и пороги светофора (v1.0.1)
# Единицы: мм для уровней/осей, градусы для угла оси.

# Допуск совпадения (ниже — GREEN по delta)
level_mm=2
grid_mm=5
grid_angle_deg=0.1

# Пороги YELLOW / RED для |delta|
level_delta_yellow_mm=2
level_delta_red_mm=10
grid_delta_yellow_mm=5
grid_delta_red_mm=20
grid_angle_yellow_deg=0.1
grid_angle_red_deg=1.0

# Имя связи-эталона (если нет exemplar_link.cfg от choose_exemplar_link)
# Подстрока без учёта регистра; пусто = первая загруженная RVT-связь
exemplar_link_default=

# Apply
apply_elevation=1
apply_grid_curve=1
apply_rename=0
# 1 = требовать role=BF в project_map (обычно не нужно: просто кладите только БФ в список)
apply_require_map_bf=0
